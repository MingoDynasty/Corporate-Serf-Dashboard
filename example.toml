#
# This is an example configuration file.
#

# How often to poll for updates (in milliseconds)
polling_interval = 1000  # 1 second

# Port to use for the backend server.
port = 8050

# Whether to enable the Dash/Flask debug server. Keep this off unless developing locally.
debug = false

# How many decimal places to round the Sensitivity. The smaller the number, the more the Sensitivities are grouped.
# For example, if Sensitivity=40.159, rounded to one digit -> 40.2
sens_round_decimal_places = 1

# How long to reuse total-play metadata before fetching it again.
scenario_metadata_cache_ttl_hours = 24

# How long to reuse cached scenario rank data before fetching it again.
scenario_rank_cache_ttl_hours = 168

# How long to reuse cached leaderboard total player counts before fetching them again.
leaderboard_total_cache_ttl_hours = 168

# Slowly fill playlist-overview percentile caches in one background thread.
# Disable this without affecting user-initiated KovaaK's rank lookups.
percentile_warmup_enabled = true

# Timeout (in seconds) for KovaaK's API requests. KovaaK's has slow spells where
# the leaderboard endpoint takes close to 30 seconds to respond but still returns
# valid data; raise this if position lookups keep timing out.
kovaaks_api_timeout_seconds = 30

# Prefix every browser tab title with this build's release label, so several
# instances running side by side are told apart from the tab bar alone: a
# release install shows its tag ("v2026.08.09.9 - Playlists"), a git checkout
# shows "dev", and a build that cannot identify itself shows "unknown".
show_version_in_title = false
