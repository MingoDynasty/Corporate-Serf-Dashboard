name: README screenshots

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    capture:
        runs-on: windows-latest
        timeout-minutes: 15
        env:
            UV_NO_SYNC: '1'
            UV_CACHE_DIR: .uv-cache
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
              with:
                  enable-cache: false
            - name: Install screenshot dependencies
              run: uv sync --locked --group screenshots
            - name: Install Chromium
              run: uv run --group screenshots playwright install chromium
            - name: Check capture error handling
              run: uv run --group screenshots pytest tests/test_capture_screenshots_browser.py --basetemp=ignore/pt-screenshot-browser
            - name: Capture the current app
              run: uv run --group screenshots python -m scripts.capture_screenshots
            - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: readme-screenshots-${{ github.sha }}
                  path: docs/screenshots/*.png
                  if-no-files-found: error
                  retention-days: 14
