name: Feature request
description: Suggest something the dashboard should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do today, and what makes it awkward?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like it to do?
    validations:
      required: false
